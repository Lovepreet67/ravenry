queue_batch_size = 2000
queue_block_ms = 100
queue_reconcile_interval_secs = 30
# Everything below is optional and shown with defaults.
[queue]
backend = "redis_stream"
consumer_prefix = "muninn"

[inbox]
batch_size = 2000
lease_secs = 60
max_attempts = 10

[workers]
processors = 2
shutdown_grace_secs = 30

[observability]
http_addr = "0.0.0.0:8080"
gauge_interval_secs = 15
