services:
  redis:
    image: redis:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL",  "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 1

  database:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  iam:
    build:
      context: .
      dockerfile: iam/Dockerfile
    ports:
      - 3001:${IAM_SERVER_PORT}
    environment:
      APP_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      APP_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/
      APP_SERVER_PORT: ${IAM_SERVER_PORT}
      APP_ADMIN_API_KEY: ${IAM_ADMIN_API_KEY}
      APP_AUTH_CONFIG__JWT_TTL_HOURS: ${IAM_JWT_TTL_HOURS}
      RUST_LOG: info

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  inbound:
    build:
      context: .
      dockerfile: inbound/Dockerfile
    extra_hosts:
    - "docker-host:192.168.65.254"
    ports:
      - ${INBOUND_SERVER_PORT}:${INBOUND_SERVER_PORT}
    volumes:
    - ./inbound/.env.toml:/app/config.toml:ro
    environment:
      CONFIG_PATH: /app/config.toml
      APP_SERVER__HOST: "0.0.0.0"
      APP_SERVER__PORT: ${INBOUND_SERVER_PORT}
      APP_IAM__PUBLIC_KEY_URL: http://host.docker.internal:3001/auth/public-key
      APP_IAM__ISSUER: iam
      APP_IAM__AUDIENCE: inbound
      APP_IAM__publish_roles: '["admin"]'
      APP_QUEUE__BACKEND: redis_stream
      APP_QUEUE__URL: redis://:${REDIS_PASSWORD}@redis:6379/
      APP_PROJECTION__REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/
      RUST_LOG: info

    depends_on:
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    restart: unless-stopped

  outbound:
    build:
      context: .
      dockerfile: outbound/Dockerfile
    extra_hosts:
    - "docker-host:192.168.65.254"
    volumes:
    - ./outbound/.env.toml:/app/config.toml:ro
    environment:
      CONFIG_PATH:  /app/config.toml
      APP_SERVER__HOST: "0.0.0.0"
      APP_SERVER__PORT: ${INBOUND_SERVER_PORT}
      APP_IAM__PUBLIC_KEY_URL: http://host.docker.internal:3001/auth/public-key
      APP_IAM__ISSUER: iam
      APP_IAM__AUDIENCE: inbound
      APP_IAM__publish_roles: '["admin"]'
      APP_QUEUE__BACKEND: redis_stream
      APP_QUEUE__URL: redis://:${REDIS_PASSWORD}@redis:6379/
      APP_PROJECTION__REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/
      RUST_LOG: info
    depends_on:
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  pg-data: