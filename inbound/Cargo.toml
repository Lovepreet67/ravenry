[package]
name = "inbound"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

streamforge = { path = "../streamforge" } # your shared queue trait + Redis impl
anyhow = "1.0.104"
redis = { version = "1.7.1", features = [
    "aio",
    "tokio-comp",
    "connection-manager",
] }
axum-extra = "0.12.6"
toml = "1.1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
iam-contracts = { path = "../iam-contracts" }
