[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
redis = { version = "1.7.1", features = [
    "aio",
    "connection-manager",
    "tokio-comp",
] }
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "tracing"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
argon2 = "0.6.0"
sqlx = { version = "0.8.6", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "uuid",
    "chrono",
] }
