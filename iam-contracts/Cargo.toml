
[package]
name = "iam-contracts"
version = "0.1.0"
edition = "2024"
description = "Shared contracts and Redis key conventions for the IAM and event delivery system"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
axum-extra = "0.12.6"
subtle = "2.6.1"
axum = "0.8.9"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
